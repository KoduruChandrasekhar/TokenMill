name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    # Tiny random-weight Qwen2 + a tokenizer trained on the fly: scheduler, allocator, layers,
    # engine equivalence, API contract. No model download.
    runs-on: ubuntu-latest
    env:
      INFER_SKIP_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.lock ruff && pip install -e . --no-deps
      - run: ruff check src tests bench baselines
      - run: pytest -q -m "not real_model and not gpu"

  golden:
    # The real 0.5B weights (cached between runs): fp32 golden outputs must match exactly.
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b-instruct-v1
      - run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: pytest -q -m "real_model and not gpu" --durations=10
