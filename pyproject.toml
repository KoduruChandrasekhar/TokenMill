[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infer"
version = "0.1.0"
description = "A from-scratch LLM inference server: continuous batching, paged KV cache, preemption, OpenAI-compatible streaming API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "tokenizers>=0.19",
    "transformers>=4.45",      # AutoTokenizer + chat templates; reference model only in tests/baselines
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "prometheus_client>=0.20",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "openai>=1.30",
    "ruff>=0.5",
]
bench = [
    "httpx>=0.27",
    "pandas>=2",
    "matplotlib>=3.8",
]

[project.scripts]
infer-serve = "infer.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
markers = [
    "real_model: needs the real Qwen2.5-0.5B-Instruct weights (downloaded from the HF hub)",
    "gpu: needs a CUDA GPU",
    "slow: takes more than ~30 s on a laptop CPU",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "bench", "baselines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B007", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["infer", "bench", "baselines", "helpers"]
